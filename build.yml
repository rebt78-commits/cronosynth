name: Compilar ChronoSynth (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: ChronoSynth-Windows
          path: |
            build/ChronoSynth_artefacts/Release/VST3
            build/ChronoSynth_artefacts/Release/Standalone
